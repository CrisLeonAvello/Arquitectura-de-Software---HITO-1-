upstream user_service {
    server user-service:8001;
}

upstream package_service {
    server package-service:8002;
}

upstream tracking_service {
    server tracking-service:8003;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # CORS headers para todas las rutas
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    # Manejo de preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # User Service routes
    location /users/ {
        proxy_pass http://user_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /createUser {
        proxy_pass http://user_service/createUser;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /getUsers {
        proxy_pass http://user_service/getUsers;
        proxy_set_header Host $host;
    }

    # Package Service routes
    location /packages/ {
        proxy_pass http://package_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /createPackage {
        proxy_pass http://package_service/createPackage;
        proxy_set_header Host $host;
    }

    location /getAllPackages {
        proxy_pass http://package_service/getAllPackages;
        proxy_set_header Host $host;
    }

    # Tracking Service routes
    location /tracking/ {
        proxy_pass http://tracking_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /updateStatus {
        proxy_pass http://tracking_service/updateStatus;
        proxy_set_header Host $host;
    }

    location ~ ^/getTracking/(.+)$ {
        proxy_pass http://tracking_service/getTracking/$1;
        proxy_set_header Host $host;
    }

    # Temporary backend routes (monolito)
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
